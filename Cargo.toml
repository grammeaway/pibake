[package]
name = "pibake"
version = "0.3.0"
edition = "2024"
description = "cargo build --release for your Pi setup: one pinned, optimized executable from a Pi agent directory."
license = "MIT OR Apache-2.0"
repository = "https://github.com/grammeaway/pibake"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
oxc = { version = "0.154.0", default-features = false, features = ["ast_visit", "semantic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"

[dev-dependencies]
hegeltest = { version = "0.49.14", features = ["static-engine"] }
